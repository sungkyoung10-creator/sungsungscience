<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코일의 자기장 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: 실험대(회로) 크게 왼쪽 + 조작 패널 오른쪽, 아래에 기록표·그래프. 태블릿 가로 기준, 좁으면 한 줄로 쌓임 */
:root{
  --bg:#e9eeec; --surface:#ffffff; --bench:#f7faf8; --grid:#dfe7e4;
  --ink:#1b2a2c; --muted:#5a6b6d; --line:#c9d4d1;
  --accent:#12635c; --accent-soft:#d6ebe7;
  --electron:#1f63d6; --current:#d2422c;
  --wire:#3a4a4d; --metal:#9aa7aa; --metal-dark:#56636a;
  --copper:#c97a2a; --cell:#2b3336; --holder:#d9dfdd;
  --wood:#e8cf9f; --wood-edge:#b8975e; --nichrome:#d9822b; --nichrome-off:#b0a48c;
  --glass:rgba(220,235,245,.35); --glass-edge:#8aa2ad;
  --lcd:#13221f; --lcd-ink:#7cf0b5;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1b; --surface:#1b2526; --bench:#162021; --grid:#213031;
  --ink:#e4ecea; --muted:#9db0ae; --line:#334546;
  --accent:#5cc4b6; --accent-soft:#1f3c3a;
  --electron:#5b9bff; --current:#ff7a62;
  --wire:#b7c4c6; --metal:#7f8d90; --metal-dark:#4a585c;
  --copper:#d88f45; --cell:#0c1112; --holder:#2a3536;
  --wood:#6b5634; --wood-edge:#8d7246; --nichrome:#f0994a; --nichrome-off:#7d735f;
  --glass:rgba(160,190,210,.18); --glass-edge:#7d97a1;
  --lcd:#0a1311; --lcd-ink:#7cf0b5; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121a1b; --surface:#1b2526; --bench:#162021; --grid:#213031;
  --ink:#e4ecea; --muted:#9db0ae; --line:#334546;
  --accent:#5cc4b6; --accent-soft:#1f3c3a;
  --electron:#5b9bff; --current:#ff7a62;
  --wire:#b7c4c6; --metal:#7f8d90; --metal-dark:#4a585c;
  --copper:#d88f45; --cell:#0c1112; --holder:#2a3536;
  --wood:#6b5634; --wood-edge:#8d7246; --nichrome:#f0994a; --nichrome-off:#7d735f;
  --glass:rgba(160,190,210,.18); --glass-edge:#7d97a1;
  --lcd:#0a1311; --lcd-ink:#7cf0b5; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;font-size:16px;border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:10px;cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--electron);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.stage{background:var(--bench);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;min-width:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.stage svg{display:block;width:100%;height:auto;max-width:100%;user-select:none;-webkit-user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--electron);display:inline-grid;place-items:center;color:#fff;font-size:12px;line-height:1;font-weight:700}
.arr{color:var(--current);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.meter.big{grid-column:1 / -1;background:var(--lcd);border-color:var(--lcd)}
.meter .k{font-size:13px;color:var(--muted);letter-spacing:.02em}
.meter.big .k{color:var(--lcd-ink);opacity:.75}
.meter .v{font-family:var(--f-mono);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.meter.big .v{font-size:44px;color:var(--lcd-ink)}
.meter .v small{font-size:.55em;margin-left:4px;font-weight:500}

.ctl{display:flex;flex-direction:column;gap:8px}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-head b{font-size:17px}
.ctl-head output{font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.ctl .hint{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;align-items:center;gap:8px}
.step{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bench);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.step:active{background:var(--accent-soft)}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:46px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--accent-soft)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--accent-soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}

.toggles{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--bench);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:12px 16px;min-height:50px;background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:14px;min-height:42px;padding:8px 12px}
.btn.danger{background:var(--current);color:#fff;font-size:14px;min-height:42px;padding:8px 12px}

.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.tbl{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--bench);font-size:13px;color:var(--muted);font-weight:500}
th:first-child,td:first-child{text-align:left;color:var(--muted)}
td{font-family:var(--f-mono)}
td.i{color:var(--accent);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-family:var(--f-body)}
.graph svg{width:100%;height:auto;display:block}
.graph .ax{stroke:var(--ink);stroke-width:1.5}
.graph .gl{stroke:var(--line);stroke-width:1}
.graph text{fill:var(--muted);font-size:12px;font-family:var(--f-mono)}
.graph text.t{fill:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:500}
.qs{margin:0;padding-left:20px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.qs li::marker{color:var(--accent);font-weight:700}
.confirm{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
footer{font-size:12px;color:var(--muted)}

/* 태블릿 가로: 스크롤 없이 한 화면 */
@media (orientation:landscape) and (min-width:600px){
  html,body{height:100%}
  body{margin:0;padding-block:12px;overflow:hidden}
  .wrap{height:100%;max-width:none;gap:10px}
  header{flex:none}
  h1{font-size:clamp(24px,3vw,34px)}
  .main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) clamp(280px,27vw,340px);align-items:stretch}
  .stage{display:flex;flex-direction:column;min-height:0}
  .stage svg{flex:1;min-height:0;width:100%;height:100%}
  .panel{min-height:0;overflow:auto;padding:14px;gap:12px;justify-content:space-between}
  .meter.big .v{font-size:clamp(32px,4.2vh,44px)}
  .meter .v{font-size:clamp(20px,3vh,26px)}
  footer{flex:none}
}
@media (orientation:landscape) and (min-width:600px) and (max-height:700px){
  header .sub,footer{display:none}
  .ctl .hint{display:none}
}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fs{font:inherit;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fs svg{width:20px;height:20px;flex:none}
.fs .ic-exit{display:none}
.fs[aria-pressed="true"] .ic-enter{display:none}
.fs[aria-pressed="true"] .ic-exit{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;text-align:center}
.rotate{display:none;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
@media (orientation:portrait) and (max-width:600px){.rotate{display:flex}}
/* 휴대폰 가로: 아주 낮은 화면에 맞춘 압축 배치 */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}
  .wrap{gap:6px}
  header{flex-wrap:nowrap;align-items:center;gap:8px}
  header .sub,footer,.ctl .hint{display:none}
  h1{font-size:18px;white-space:nowrap}
  .seg{padding:3px;border-radius:10px;gap:2px}
  .seg button{font-size:13px;min-height:34px;padding:4px 10px;border-radius:8px}
  .fs{min-height:34px;font-size:13px;padding:0 10px;border-radius:10px}
  .fs .lbl{display:none}
  .main{gap:8px;grid-template-columns:minmax(0,1fr) clamp(210px,30vw,270px)}
  .stage{border-radius:12px}
  .legend{padding:3px 10px;font-size:11px;gap:2px 12px}
  .legend span:last-child{display:none}
  .dot{width:11px;height:11px;font-size:9px}
  .panel{padding:8px;gap:6px;border-radius:12px;justify-content:flex-start}
  .meters{gap:5px}
  .meter{padding:3px 8px;border-radius:8px;gap:0}
  .meter .k{font-size:11px}
  .meter.big .v{font-size:26px}
  .meter .v{font-size:17px}
  .ctl{gap:0}
  .ctl-head b{font-size:13px}
  .ctl-head output{font-size:13px}
  .step{width:36px;height:36px;font-size:20px;border-radius:9px}
  input[type=range]{height:36px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-8px}
  .toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .chip{font-size:12px;min-height:34px;padding:4px 2px;white-space:nowrap}
  .meters{grid-template-columns:1.3fr 1fr 1fr}
  .meter.big{grid-column:auto}
  .meter.big .v{font-size:22px}
  .meter .v{font-size:16px;margin-top:4px}
}
/* 가로 화면(태블릿·휴대폰 공통): 제목 없애고 회로를 화면 높이 전체로, 버튼은 오른쪽 위 */
@media (orientation:landscape) and (min-width:600px), (orientation:landscape) and (max-height:520px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,27vw,340px);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"stage tools" "stage panel";gap:10px 12px}
  header,.main{display:contents}
  header > div:first-child,.rotate,footer{display:none}
  .tools{grid-area:tools;flex-wrap:nowrap;gap:8px;justify-content:space-between}
  .seg{flex:1;min-width:0}
  .seg button{flex:1;padding:8px 6px;font-size:15px;white-space:nowrap}
  .fs .lbl{display:none}
  .stage{grid-area:stage;min-height:0}
  .panel{grid-area:panel;min-height:0}
  .toggles{display:grid;grid-template-columns:repeat(3,1fr)}
  .chip{padding-inline:4px;white-space:nowrap}
}
/* 휴대폰 가로 + 주소창: 더 촘촘하게 */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:max(4px,env(safe-area-inset-top,0px)) max(4px,env(safe-area-inset-bottom,0px))}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,29vw,260px);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"stage tools" "stage panel";gap:5px 6px}
  header,.main{display:contents}
  header > div:first-child,.rotate,footer{display:none}
  .tools{grid-area:tools;flex-wrap:nowrap;gap:5px;justify-content:space-between}
  .seg{flex:1;min-width:0}
  .seg button{flex:1;padding:4px 6px;font-size:13px;min-height:34px}
  .seg .long{display:none}
  .stage{grid-area:stage;min-height:0;border-radius:10px}
  .panel{grid-area:panel;min-height:0;padding:7px;gap:5px}
  .step{width:32px;height:32px;font-size:18px}
  input[type=range]{height:32px}
  .chip{min-height:30px}
}
@media (orientation:landscape) and (max-height:400px){
  .legend{display:none}
  .meter.big .v{font-size:20px}
  .meter .v{font-size:15px}
}
/* 아주 낮은 화면: 전류는 회로 속 전류계로 보고, 위 숫자 칸은 숨김 */
@media (orientation:landscape) and (max-height:290px){
  .meters{display:none}
}
/* SVG 회로 */
.w{fill:none;stroke:var(--wire);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.tx{fill:var(--ink);font-family:var(--f-body)}
.tm{fill:var(--muted);font-family:var(--f-body)}
.mono{font-family:var(--f-mono);font-weight:600}

/* 코일의 자기장 실험실 전용 */
:root{--north:#d63a2a;--south:#2f66c9;--field:#6a3fc8;--needle-s:#e9edee;--copper-front:#c8782a;--copper-back:#8a5220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--north:#ff6a55;--south:#5b8ff0;--field:#b494ff;--needle-s:#cfd6d8;--copper-front:#e0954a;--copper-back:#9c6230}}
:root[data-theme="dark"]{--north:#ff6a55;--south:#5b8ff0;--field:#b494ff;--needle-s:#cfd6d8;--copper-front:#e0954a;--copper-back:#9c6230}
.meters.one{grid-template-columns:1fr!important}
.meter.big .v{font-family:var(--f-body);font-weight:700}
.act{display:flex;flex-direction:column;gap:8px}
.btn{width:100%}
.btn.alt{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.btn.off{background:var(--current)}
.btn.field{background:var(--field)}
.btn.field[aria-pressed="true"]{background:var(--surface);color:var(--field);border:2px solid var(--field)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.two{display:flex;gap:8px}
.two .btn{flex:1;min-width:0;white-space:nowrap;padding-inline:4px}
.btn.dirb[aria-pressed="true"]{background:var(--current);border-color:var(--current);color:#fff}
@media (max-width:1100px){.two .lw{display:none}}
.flowA{fill:var(--current);stroke:var(--surface);stroke-width:1.5}
.flowA.back{opacity:.35}
.ring-front{fill:none;stroke:var(--current);stroke-width:7;stroke-linecap:round}
.ring-back{fill:none;stroke:var(--current);stroke-width:4;stroke-dasharray:6 6;opacity:.5}
.ring-flow{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-dasharray:4 14;stroke-linecap:round;animation:flow linear infinite;opacity:.9}
.ring-flow.rev{animation-name:flowrev}
.ring-head{fill:var(--current);stroke:var(--surface);stroke-width:1.5}
.ring-head.back{opacity:.55}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes flowrev{to{stroke-dashoffset:18}}
.panel{justify-content:flex-start!important}
.panel .hint{display:block}
.crow{margin-top:auto;gap:6px}
.crow .btn{flex:1;min-width:0;white-space:nowrap;padding:8px 6px;font-size:15px}
.btn.add{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.add .cnt{font-family:var(--f-mono);color:var(--accent);margin-left:2px}
@media (max-width:1100px){.btn.add .lw{display:none}}
.step:disabled{opacity:.4;cursor:not-allowed}
.legend .ndl{display:inline-block;width:8px;height:18px;background:linear-gradient(var(--north) 50%,var(--needle-s) 50%);border:1px solid var(--metal-dark);border-radius:4px}
.legend .fl{display:inline-block;width:24px;height:3px;background:var(--field);border-radius:2px}
.fline{fill:none;stroke:var(--field);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.fline.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.4s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.farrow{fill:var(--field)}
.farrow.late{opacity:0;animation:fade .4s 1.1s forwards}
@keyframes fade{to{opacity:1}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-14px)}}
.compass{cursor:grab;touch-action:none}
.compass.drag{cursor:grabbing}
.compass.drag circle:first-child{stroke:var(--accent);stroke-width:4}
.lead{fill:none;stroke:var(--wire);stroke-width:5;stroke-linejoin:round}
.cfront{fill:none;stroke:var(--copper-front);stroke-width:6;stroke-linecap:round}
.cback{fill:none;stroke:var(--copper-back);stroke-width:4;stroke-linecap:round;opacity:.6}
@media (orientation:landscape) and (max-height:520px){
  .btn{min-height:36px;font-size:14px;padding:6px 10px;border-radius:10px}
  .act{gap:5px}
  .seg button{padding:4px 2px;font-size:12.5px}
  .crow .step{width:36px;height:36px}
  .crow .btn{padding:6px 2px}
  .btn.add .lw{display:none}
  .panel .hint{font-size:12px;display:block}
  .meter.big .v{font-size:20px}
}
@media (orientation:landscape) and (max-height:400px){.panel .hint{display:none}}
@media (orientation:landscape) and (max-height:330px){.panel .hint{display:none}.panel .meters{display:none}}
#ampCtl{gap:2px}
@media (prefers-reduced-motion: reduce){.fline.grow,.farrow.late,.pop,.ring-flow{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>코일의 자기장 실험실</h1>

    </div>

      <svg class="ic-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>

    </div>

  <div class="rotate" role="note">휴대폰을 가로로 돌리면 실험 장치와 버튼이 한 화면에 모두 보여요.</div>

  <div class="main">
    <section class="stage" aria-label="실험 장치">
      <svg id="lab" viewBox="0 20 1000 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="나침반과 자석 또는 코일">
        <defs>
          <marker id="fArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--field)"/></marker>
        </defs>
        <g id="gLeads"></g>

        <g id="gFieldUnder"></g>
        <g id="gBody"></g>

        <g transform="translate(70 70)">

      </div>

          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>

  <footer>화면 위쪽이 북쪽이에요 · 나침반 바늘의 빨간 쪽이 N극 · 나침반은 지구 자기장(북쪽)과 자석·코일의 자기장을 함께 받아요 · 자기장 선이 촘촘할수록 자기장이 세요.</footer>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const CX=500, CY=270, HL=150, A=45, NW=64;
const S={mode:"none",on:false,rev:false,flip:false,field:false,I:2,showDir:false};
const MAG_I=3;   // 막대자석은 코일에 3 A가 흐를 때와 같은 세기로 계산
// 처음 4개: 서·동·북·남 / 추가할 때마다 이 순서대로 놓여요 (최대 30개)
const HOME=[[240,270],[760,270],[500,160],[500,380],
  [350,160],[650,160],[350,380],[650,380],[255,165],[745,165],[255,375],[745,375],
  [110,270],[890,270],[500,80],[350,80],[650,80],[200,80],[800,80],
  [110,150],[890,150],[110,390],[890,390],[280,520],[720,520],
  [110,500],[890,500],[190,545],[810,545],[950,80]];
const START=4,MAX=HOME.length;
let comps=[];

function el(tag,attrs,parent,text){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(text!=null)e.textContent=text;
  if(parent)parent.appendChild(e);return e;
}
const gFlow=$("gFlow"),gLeads=$("gLeads"),gBack=$("gBack"),gFU=$("gFieldUnder"),gBody=$("gBody"),gFO=$("gFieldOver"),gC=$("gCompass");

/* ---------- 자기장 계산 ----------
   막대자석과 코일 모두 같은 크기의 '전류가 흐르는 코일' 모형으로 계산해요.
   (자석 속 원자들의 작은 전류 = 코일 표면의 전류와 같은 자기장) */
const active=()=>S.mode==="mag"||(S.mode==="coil"&&S.on);
const dir=()=>S.mode==="mag"?(S.flip?-1:1):(S.rev?-1:1);   // +1이면 오른쪽 끝이 N극
const amp=()=>S.mode==="mag"?MAG_I:S.I;
let wires=[];
function buildWires(k){
  const d=dir()*(k==null?amp():k);wires=[];
  for(let i=0;i<NW;i++){const x=-HL+2*HL*i/(NW-1);wires.push([x,A,d],[x,-A,-d]);}
}
function B(sx,sy){
  const x=sx-CX,y=-(sy-CY);let bx=0,by=0;
  for(const [wx,wy,I] of wires){const dx=x-wx,dy=y-wy,r2=dx*dx+dy*dy+4;bx+=I*(-dy)/r2;by+=I*dx/r2;}
  return [bx,-by];
}
let EARTH=1;
function calibrate(){buildWires(1);const b=B(760,270);EARTH=Math.hypot(b[0],b[1]);}
function unit(v){const m=Math.hypot(v[0],v[1])||1;return [v[0]/m,v[1]/m];}

/* ---------- 자기장 선 그리기 ---------- */
function trace(p,sgn){
  const h=4,pts=[p];let q=p,len=0;
  for(let i=0;i<3000;i++){
    const u1=unit(B(q[0],q[1])),m=[q[0]+sgn*u1[0]*h/2,q[1]+sgn*u1[1]*h/2];
    const u2=unit(B(m[0],m[1]));q=[q[0]+sgn*u2[0]*h,q[1]+sgn*u2[1]*h];
    pts.push(q);len+=h;
    if(q[0]<-20||q[0]>1020||q[1]<0||q[1]>620)return {pts,closed:false};
    if(len>60&&Math.hypot(q[0]-p[0],q[1]-p[1])<h*1.3){pts.push(p);return {pts,closed:true};}
  }
  return {pts,closed:false};
}
function fieldLines(){
  // 자기장 선 하나가 늘 같은 양의 자기장을 나타내도록 그려요.
  // 코일 안쪽 선 사이 간격 = G/전류 → 전류가 0.1 A만 바뀌어도 선이 조금씩 촘촘해지고,
  // 간격이 충분히 좁아지면 바깥쪽(코일 벽 가까이)에서 새 선이 생겨나요.
  const G=0.8*A,I=amp(),seeds=[];
  for(let k=0;;k++){const y=(k+.5)*G/I;if(y>.95*A)break;seeds.push([CX,CY-y],[CX,CY+y]);}
  const lines=[];
  for(const s of seeds){
    const f=trace(s,1);
    if(f.closed)lines.push(f.pts);
    else{const b=trace(s,-1);lines.push(b.pts.slice(1).reverse().concat(f.pts));}
  }
  return lines;
}
function drawField(animate){
  gFU.innerHTML=gFO.innerHTML="";
  $("lgF").hidden=!(S.field&&active());
  if(!S.field||!active())return;
  const g=S.mode==="mag"?gFU:gFO;
  for(const pts of fieldLines()){
    const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
    const path=el("path",{d,class:"fline"+(animate?" grow":""),pathLength:1},g);
    // 화살표: 선을 따라 일정한 간격으로
    let acc=0,next=90;
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i];acc+=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(acc>=next){
        const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
        if(b[0]>15&&b[0]<985&&b[1]>25&&b[1]<595)
          el("path",{d:"M-8 -6 L7 0 L-8 6 Z",transform:`translate(${b[0].toFixed(1)} ${b[1].toFixed(1)}) rotate(${ang.toFixed(1)})`,class:"farrow"+(animate?" late":"")},g);
        next+=170;
      }
    }
  }
}

/* ---------- 장치 그리기 ---------- */
function drawMagnet(){
  const d=dir(),xl=CX-HL,w=2*HL,h=2*A,y=CY-A;
  const g=el("g",{class:"pop",style:"cursor:pointer"},gBody);
  const leftN=d<0;
  el("rect",{x:xl,y,width:w/2,height:h,fill:leftN?"var(--north)":"var(--south)",rx:6},g);
  el("rect",{x:CX,y,width:w/2,height:h,fill:leftN?"var(--south)":"var(--north)",rx:6},g);
  el("rect",{x:CX-8,y,width:16,height:h,fill:leftN?"var(--south)":"var(--north)"},g);
  el("rect",{x:CX-8,y,width:8,height:h,fill:leftN?"var(--north)":"var(--south)"},g);
  el("rect",{x:xl,y,width:w,height:h,rx:6,fill:"none",stroke:"var(--ink)","stroke-opacity":.25,"stroke-width":2},g);
  el("text",{x:xl+50,y:CY+15,"text-anchor":"middle","font-size":42,"font-weight":700,fill:"#fff"},g,leftN?"N":"S");
  el("text",{x:xl+w-50,y:CY+15,"text-anchor":"middle","font-size":42,"font-weight":700,fill:"#fff"},g,leftN?"S":"N");
  el("text",{x:CX,y:CY+A+30,"text-anchor":"middle","font-size":17,class:"tm"},g,"막대자석");
  g.addEventListener("click",toggleField);
}
function drawCoil(){
  const NT=6,p=2*HL/NT,top=CY-A,bot=CY+A,d=dir(),on=S.on;
  // 유리관 + 뒤쪽 도선
  el("rect",{x:CX-HL-10,y:top-6,width:2*HL+20,height:2*A+12,rx:10,fill:"var(--glass)",stroke:"var(--glass-edge)","stroke-width":2},gBack);
  for(let i=0;i<NT;i++){const x0=CX-HL+i*p;
    el("path",{d:ptsD(helix(x0,p,Math.PI,2*Math.PI)),class:"cback"},gBack);}
  // 앞쪽 도선
  const g=el("g",{class:"pop",style:"cursor:pointer"},gBody);
  for(let i=0;i<NT;i++){const x0=CX-HL+i*p;
    el("path",{d:ptsD(helix(x0,p,0,Math.PI)),class:"cfront"},g);}
  el("rect",{x:CX-HL-10,y:top-6,width:2*HL+20,height:2*A+12,fill:"transparent"},g);
  el("text",{x:CX,y:bot+34,"text-anchor":"middle","font-size":17,class:"tm"},g,"코일");
  g.addEventListener("click",toggleField);
  // 전원 장치와 도선
  const L=[[CX-HL,top],[190,top],[190,450],[440,450],[440,474]];
  const R=[[CX+HL,top],[810,top],[810,450],[560,450],[560,474]];
  for(const pts of [L,R])el("polyline",{points:pts.map(q=>q.join(",")).join(" "),class:"lead"},gLeads);
  if(on&&S.showDir)makeFlow(L,R,NT,p,top,bot,d);
  const box=el("g",{},gLeads);
  el("rect",{x:395,y:474,width:210,height:92,rx:12,fill:"var(--holder)",stroke:"var(--metal)","stroke-width":2},box);
  el("rect",{x:448,y:500,width:104,height:36,rx:6,fill:"var(--lcd)"},box);
  el("text",{x:500,y:525,"text-anchor":"middle","font-size":20,fill:"var(--lcd-ink)",class:"mono"},box,on?S.I.toFixed(1)+" A":"0.0 A");
  el("circle",{cx:420,cy:540,r:7,fill:on?"#38d27a":"var(--metal)"},box);
  el("text",{x:500,y:557,"text-anchor":"middle","font-size":13,class:"tm"},box,"전원 장치");
  const plusLeft=d>0;
  el("circle",{cx:440,cy:476,r:9,fill:plusLeft?"var(--north)":"var(--cell)"},box);
  el("circle",{cx:560,cy:476,r:9,fill:plusLeft?"var(--cell)":"var(--north)"},box);
  el("text",{x:418,y:470,"text-anchor":"middle","font-size":20,"font-weight":700,fill:plusLeft?"var(--north)":"var(--ink)"},box,plusLeft?"+":"−");
  el("text",{x:582,y:470,"text-anchor":"middle","font-size":20,"font-weight":700,fill:plusLeft?"var(--ink)":"var(--north)"},box,plusLeft?"−":"+");
}

/* ---------- 둥글게 감긴 코일 한 바퀴 (나선을 옆에서 본 모습) ----------
   t = 0(위) → π(아래)는 앞쪽, π → 2π(다시 위)는 뒤쪽 */
const ROUND=17;
function helix(x0,p,t0,t1){
  const pts=[];for(let k=0;k<=24;k++){const t=t0+(t1-t0)*k/24;
    pts.push([x0+p*t/(2*Math.PI)+ROUND*Math.sin(t),CY-A*Math.cos(t)]);}
  return pts;
}
const ptsD=pts=>"M"+pts.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L");

/* ---------- 도선을 따라 움직이는 전류 화살표 ----------
   + 단자 → 왼쪽 도선 → 코일(앞쪽 실선 / 뒤쪽은 흐리게) → 오른쪽 도선 → − 단자 */
let flow=null;
function makeFlow(L,R,NT,p,top,bot,d){
  const segs=[];
  const line=(pts)=>{for(let i=1;i<pts.length;i++)segs.push({a:pts[i-1],b:pts[i],back:false});};
  const arc=(pts,back)=>{for(let i=1;i<pts.length;i++)segs.push({a:pts[i-1],b:pts[i],back});};
  line(L.slice().reverse());                       // + 단자에서 코일 왼쪽 끝까지
  for(let i=0;i<NT;i++){const x0=CX-HL+i*p;
    arc(helix(x0,p,0,Math.PI),false);           // 앞쪽 도선
    arc(helix(x0,p,Math.PI,2*Math.PI),true);    // 뒤쪽 도선
  }
  line(R);                                          // 코일 오른쪽 끝에서 − 단자까지
  let list=d>0?segs:segs.slice().reverse().map(g=>({a:g.b,b:g.a,back:g.back}));
  let Ltot=0;for(const g of list){g.l=Math.hypot(g.b[0]-g.a[0],g.b[1]-g.a[1]);g.s0=Ltot;Ltot+=g.l;g.ang=Math.atan2(g.b[1]-g.a[1],g.b[0]-g.a[0])*180/Math.PI;}
  const N=Math.round(Ltot/75),nodes=[];
  for(let k=0;k<N;k++)nodes.push(el("path",{d:"M-8 -7 L8 0 L-8 7 Z",class:"flowA"},gFlow));
  flow={list,L:Ltot,N,sp:Ltot/N,off:flow?flow.off:0,nodes};
}
function stepFlow(dt){
  if(!flow)return;
  flow.off=(flow.off+S.I*40*dt)%flow.L;
  let j=0;
  for(let k=0;k<flow.N;k++){
    const s=(flow.off+k*flow.sp)%flow.L;
    while(j>0&&flow.list[j].s0>s)j--;
    while(j<flow.list.length-1&&flow.list[j].s0+flow.list[j].l<s)j++;
    const g=flow.list[j],t=(s-g.s0)/(g.l||1);
    const x=g.a[0]+(g.b[0]-g.a[0])*t,y=g.a[1]+(g.b[1]-g.a[1])*t;
    const n=flow.nodes[k];
    n.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${g.ang.toFixed(1)})`);
    n.setAttribute("class",g.back?"flowA back":"flowA");
  }
}

/* ---------- 나침반 ---------- */
function addCompass(){
  if(comps.length>=MAX)return;
  const [x,y]=HOME[comps.length];
  {
    const g=el("g",{class:"compass",transform:`translate(${x} ${y})`},gC);
    el("circle",{r:30,fill:"var(--surface)",stroke:"var(--metal-dark)","stroke-width":3},g);
    for(let k=0;k<8;k++){const a=k*Math.PI/4,r1=k%2?25:22;el("line",{x1:Math.sin(a)*r1,y1:-Math.cos(a)*r1,x2:Math.sin(a)*27,y2:-Math.cos(a)*27,stroke:"var(--muted)","stroke-width":k%2?1:2},g);}
    const nd=el("g",{},g);
    el("path",{d:"M0 -24 L6 0 L-6 0 Z",fill:"var(--north)"},nd);
    el("path",{d:"M0 24 L6 0 L-6 0 Z",fill:"var(--needle-s)",stroke:"var(--metal-dark)","stroke-width":1},nd);
    el("circle",{r:3.5,fill:"var(--ink)"},g);
    const c={x,y,hx:x,hy:y,th:0,w:0,g,nd};comps.push(c);
    dragify(c);
    if(comps.length>START)g.classList.add("pop");
  }
  countUI();
}
function removeCompass(){ if(comps.length<=1)return; comps.pop().g.remove(); countUI(); }
function countUI(){
  $("oC").textContent=`${comps.length}/${MAX}`;
  $("cPlus").disabled=comps.length>=MAX;
  $("cMinus").disabled=comps.length<=1;
}
function target(c){
  if(!active())return 0;
  const b=B(c.x,c.y);return Math.atan2(b[0],-(b[1]-EARTH));   // 지구 자기장(북쪽) + 코일·자석의 자기장   // 위쪽(북)에서 시계 방향 각도
}
function dragify(c){
  let id=null;
  const svg=$("lab");
  const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  c.g.addEventListener("pointerdown",ev=>{id=ev.pointerId;c.g.setPointerCapture(id);c.g.classList.add("drag");ev.preventDefault();});
  c.g.addEventListener("pointermove",ev=>{if(ev.pointerId!==id)return;const q=pt(ev);
    c.x=Math.max(40,Math.min(960,q.x));c.y=Math.max(50,Math.min(570,q.y));c.g.setAttribute("transform",`translate(${c.x} ${c.y})`);});
  const end=()=>{id=null;c.g.classList.remove("drag");};
  c.g.addEventListener("pointerup",end);c.g.addEventListener("pointercancel",end);
  c.g.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
}

/* ---------- 화면 갱신 ---------- */
function drawAll(animate){
  gLeads.innerHTML=gBack.innerHTML=gBody.innerHTML=gFlow.innerHTML="";flow=null;
  buildWires();
  if(S.mode==="mag")drawMagnet();
  if(S.mode==="coil")drawCoil();
  drawField(animate);
  panel();
}
function panel(){
  const m=S.mode;
  $("bPower").hidden=$("dirRow").hidden=m!=="coil";
  $("bDir").setAttribute("aria-pressed",S.showDir);
  $("bFlip").hidden=m!=="mag";
  $("ampCtl").hidden=m!=="coil";
  $("oA").textContent=S.I.toFixed(1)+" A";if(document.activeElement!==$("sA"))$("sA").value=S.I;
  $("bPower").textContent=S.on?"전류 끊기":"전류 연결하기";
  $("bPower").classList.toggle("off",S.on);
  const bf=$("bField");bf.disabled=!active();
  bf.textContent=S.field&&active()?"자기장 지우기":"자기장 그리기";bf.setAttribute("aria-pressed",S.field&&active());
  const [k,v]=m==="none"?["주변 상태","자석 없음"]:m==="mag"?["주변 상태","막대자석"]:["코일에 흐르는 전류",S.on?`ON · ${S.I.toFixed(1)} A`:"OFF"];
  $("stK").textContent=k;$("stV").textContent=v;
  $("hint").textContent=m==="none"?"주변에 자석도 전류도 없을 때, 나침반 바늘의 N극이 어느 쪽을 가리키는지 살펴보세요."
    :m==="mag"?"막대자석 주위에서 나침반 바늘이 어떻게 바뀌었는지 살펴보세요. 자석을 눌러도 자기장이 그려져요."
    :S.on?(S.showDir?"화살표가 코일 도선을 따라 도는 방향과 나침반 바늘·자기장의 방향을 함께 비교해 보세요.":"전류의 세기와 방향을 바꾸면 나침반 바늘과 자기장 선이 어떻게 달라지는지 비교해 보세요.")
    :"전류를 연결하기 전과 후의 나침반 바늘을 비교해 보세요.";
}
function toggleField(){ if(!active())return; S.field=!S.field; drawField(true); panel(); }
function setMode(m){
  S.mode=m;
  for(const [id,v] of [["m-none","none"],["m-mag","mag"],["m-coil","coil"]])$(id).setAttribute("aria-pressed",m===v);
  if(m!=="coil")S.on=false;
  drawAll(true);
}
$("m-none").onclick=()=>setMode("none");
$("m-mag").onclick=()=>setMode("mag");
$("m-coil").onclick=()=>setMode("coil");
$("bPower").onclick=()=>{S.on=!S.on;drawAll(true);};
$("bRev").onclick=()=>{S.rev=!S.rev;drawAll(true);};
$("bDir").onclick=()=>{S.showDir=!S.showDir;drawAll(false);};
$("bFlip").onclick=()=>{S.flip=!S.flip;drawAll(true);};
$("bField").onclick=toggleField;
let ampPending=false;
function setAmp(v){S.I=Math.max(.5,Math.min(4,Math.round(v*10)/10));
  if(ampPending)return;ampPending=true;requestAnimationFrame(()=>{ampPending=false;drawAll(false);});}
$("sA").addEventListener("input",()=>setAmp(+$("sA").value));
$("aMinus").onclick=()=>setAmp(S.I-.1);
$("aPlus").onclick=()=>setAmp(S.I+.1);
$("cPlus").onclick=addCompass;
$("cMinus").onclick=removeCompass;
$("bReset").onclick=()=>{for(const c of comps){c.x=c.hx;c.y=c.hy;c.g.setAttribute("transform",`translate(${c.x} ${c.y})`);}};

/* ---------- 바늘 움직임 (살짝 흔들리다 멈춤) ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  for(const c of comps){
    let d=target(c)-c.th;d=Math.atan2(Math.sin(d),Math.cos(d));
    c.w+=(60*d-6*c.w)*dt;c.th+=c.w*dt;
    c.nd.setAttribute("transform",`rotate(${(c.th*180/Math.PI).toFixed(2)})`);
  }
  stepFlow(dt);
  requestAnimationFrame(frame);
}

calibrate();
for(let i=0;i<START;i++)addCompass();
drawAll(false);

/* ---------- 전체화면 ---------- */
const fsBtn=$("fsBtn"),root=document.documentElement;
const isIOS=/iPhone|iPod/.test(navigator.userAgent);
if(window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches)fsBtn.hidden=true;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},4000);
}
fsBtn.addEventListener("click",async()=>{
  try{
    if(fsEl()){await (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen());return;}
    const req=root.requestFullscreen||root.webkitRequestFullscreen;
    if(!req)throw new Error("unsupported");
    await req.call(root);
    try{await screen.orientation.lock("landscape");}catch(e){}
  }catch(e){
    toast(isIOS?"아이폰에서는 전체화면 버튼이 동작하지 않아요. 주소창의 ‘가가’ → ‘툴바 가리기’를 눌러 보세요.":"이 기기에서는 전체화면을 지원하지 않아요. 크롬·사파리 브라우저에서 열어 보세요.");
  }
});
const syncFs=()=>{const on=!!fsEl();fsBtn.setAttribute("aria-pressed",on);};
document.addEventListener("fullscreenchange",syncFs);
document.addEventListener("webkitfullscreenchange",syncFs);
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>

</body>
</html>
